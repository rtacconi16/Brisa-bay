name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tools/test-locator.mjs
      - run: node tools/validate-stores.mjs
      - run: node tools/test-age-gate.mjs
      - run: node tools/check-pages.mjs
      - run: python3 tools/test-server.py
