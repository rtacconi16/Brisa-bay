name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tools/test-locator.mjs
      - run: node tools/validate-stores.mjs
      - run: node tools/test-age-gate.mjs
      - run: node tools/check-pages.mjs
      - run: python3 tools/test-server.py
      # Build the directory `wix release` uploads, and fail if it contains
      # anything that should not be public or anything Wix cannot serve.
      # Without this the release is the first place a mistake shows up, and by
      # then it is live.
      - run: node tools/build-wix.mjs --check
